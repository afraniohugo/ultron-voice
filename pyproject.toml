[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-voice"
version = "0.1.0"
description = "Ultron Voice — voz e audio 100% local, interface MCP + CLI"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn>=0.30,<0.32",
    "httpx>=0.28,<0.29",
    "mcp>=1.2,<2.0",
    "pydantic>=2.7,<3.0",
    "ffmpeg-python>=0.2.0",
    "pydub>=0.23,<0.26",
    "numpy>=2.0,<3.0",
    "cryptography>=44,<46",
    "jinja2>=3.1,<4.0",
    "watchfiles>=1.0,<2.0",
]

[project.scripts]
ultron-voice-mcp = "ultron_voice.mcp:main"
ultron-voice = "ultron_voice.cli:console_main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<0.10"]
tts = ["torch>=2.5,<3", "transformers>=5.0,<6", "torchaudio>=2.5,<3"]
asr = ["openai-whisper>=20250130", "vosk>=0.3,<0.4"]
local = ["torch>=2.5,<3", "transformers>=5.0,<6", "openai-whisper>=20250130", "vosk>=0.3,<0.4", "requests>=2.32,<3.0"]

[tool.setuptools]
packages.find.include = ["ultron_voice*", "backend.engine*"]

[tool.setuptools.package-data]
ultron_voice = ["sapi_worker.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
